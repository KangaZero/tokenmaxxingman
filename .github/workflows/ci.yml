# Test the CLI and the website on every push + PR.
# Matrix: Node 22 (LTS floor declared in engines.node) and Node 26.2 (current).
# Package manager: pnpm, pinned via the packageManager field in package.json.
#
# Major-version pinned + Dependabot watched. See .github/dependabot.yml.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '26.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (CLI)
        run: pnpm run typecheck

      - name: Lint (CLI)
        run: pnpm run lint

      - name: Test (CLI)
        run: pnpm test

      - name: Build (CLI)
        run: pnpm run build

      - name: Typecheck (web)
        run: pnpm -F tokenmaxxingman-web run typecheck

      - name: Build (web)
        run: pnpm -F tokenmaxxingman-web run build
