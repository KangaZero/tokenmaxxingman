# Manual release workflow — triggered via GitHub Actions UI (workflow_dispatch only).
# Before running: add NPM_TOKEN to repository secrets at
# Settings → Secrets and variables → Actions → New repository secret.
# TODO: set NPM_TOKEN secret in repo before dispatching this workflow.

name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
