# Manual npm publish workflow.
# Before running: set the NPM_TOKEN secret (Automation type) in repo Settings.
# Triggered via Actions UI (workflow_dispatch only) — pushing a tag does NOT
# auto-publish.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for npm provenance attestation

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.2'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # pnpm publish honours package.json `publishConfig` (access, provenance).
      - name: Publish
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
