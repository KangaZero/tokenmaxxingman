<!doctype html>
<html lang="en" class="bg-ink text-bone">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var saved = localStorage.getItem('tmm_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'light' || (!saved && !prefersDark)) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="tokenmaxxingman — we measured which human language tokenizes worst. A deliberately maximalist token-expenditure toolkit with a reproducible benchmark behind it. Spoiler: it's not Classical Chinese."
    />
    <meta property="og:title" content="tokenmaxxingman" />
    <meta property="og:description" content="Tokens are a measurable resource. We spend them without restraint. Inuktitut wins. By a lot." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>tokenmaxxingman — we measured which human language tokenizes worst</title>
  </head>
  <body class="font-body antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
